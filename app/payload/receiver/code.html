<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recomp Store</title>
<style>body{margin:0;background:#0b1220;color:#eef3f8;font:16px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}main{max-width:420px;margin:0 auto;padding:40px 16px}
h1{font-size:24px}p{color:#b9c4d3}input{width:100%;font:700 28px monospace;letter-spacing:.3em;text-align:center;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#eef3f8}
button{margin-top:14px;width:100%;border:0;border-radius:14px;padding:14px;font:700 17px inherit;background:#35d6f4;color:#06111c}</style></head><body><main>
<h1>Enter the code on your TV</h1><p>Recomp Store shows a 6-digit code on the Upload screen.</p>
<form onsubmit="location.search='?c='+encodeURIComponent(this.c.value.replace(/\D/g,''));return false"><input name="c" inputmode="numeric" maxlength="6" autocomplete="one-time-code" autofocus><button>Continue</button></form>
</main></body></html>
